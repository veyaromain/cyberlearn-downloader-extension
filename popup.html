<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      margin: 0 auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #ffffff;
      color: #1d1d1f;
    }

    header {
      padding: 16px 16px 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    header div { flex: 1; }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    header p {
      margin-top: 3px;
      font-size: 11px;
      color: #6e6e73;
    }

    #btn-reload {
      flex-shrink: 0;
      margin-top: 1px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      color: #6e6e73;
      font-size: 14px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
    }

    #btn-reload:hover { color: #0071e3; background: #f0f0f5; }
    #btn-reload.spinning { animation: spin 0.6s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Barre de chargement --- */
    #loader {
      height: 2px;
      background: #e5e5e5;
      overflow: hidden;
    }

    #loader-bar {
      height: 100%;
      width: 40%;
      background: #0071e3;
      border-radius: 2px;
      animation: slide 1.1s ease-in-out infinite;
    }

    #loader.hidden { visibility: hidden; }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* --- Sélecteur de mode --- */
    #mode-selector {
      display: flex;
      padding: 10px 16px;
      gap: 8px;
    }

    .mode-btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 500;
      border: 1.5px solid #d1d1d6;
      border-radius: 7px;
      background: #fff;
      color: #6e6e73;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      line-height: 1.3;
    }

    .mode-btn:hover { border-color: #0071e3; color: #0071e3; }

    .mode-btn.active {
      border-color: #0071e3;
      background: #0071e3;
      color: #fff;
    }

    /* --- Options panel (toggle) --- */
    #options-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px 8px;
      cursor: pointer;
      user-select: none;
    }

    #options-toggle span {
      font-size: 11px;
      color: #6e6e73;
    }

    #options-toggle .chevron {
      font-size: 9px;
      color: #b0b0b5;
      transition: transform 0.2s;
    }

    #options-toggle.open .chevron { transform: rotate(180deg); }

    #options-panel {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.2s ease;
      background: #f9f9fb;
    }

    #options-panel.open { max-height: 200px; }

    .option-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 16px;
      font-size: 11px;
      color: #1d1d1f;
      cursor: pointer;
      user-select: none;
    }

    .option-row:last-child { padding-bottom: 10px; }

    .option-row input[type="checkbox"] {
      accent-color: #0071e3;
      width: 13px;
      height: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .option-row.section-label {
      font-size: 10px;
      font-weight: 600;
      color: #6e6e73;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding-bottom: 2px;
      cursor: default;
    }

    /* --- Filtres par type --- */
    #type-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 4px 16px 10px;
    }

    .type-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 20px;
      border: 1.5px solid #d1d1d6;
      background: #fff;
      font-size: 10px;
      font-weight: 600;
      color: #6e6e73;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      transition: all 0.12s;
    }

    .type-chip.active {
      border-color: #0071e3;
      background: #e8f0fd;
      color: #0071e3;
    }

    .type-chip .chip-count {
      font-weight: 400;
      opacity: 0.7;
    }

    /* --- Barre tout sélectionner / tout décocher --- */
    #select-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px 4px;
    }

    #select-bar span {
      font-size: 11px;
      color: #6e6e73;
    }

    #select-bar button {
      font-size: 11px;
      color: #0071e3;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    #select-bar button:hover { text-decoration: underline; }

    /* --- Liste des fichiers --- */
    #file-list {
      max-height: 200px;
      overflow-y: auto;
      padding: 4px 0 8px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 16px;
      font-size: 12px;
      color: #1d1d1f;
      cursor: pointer;
      user-select: none;
    }

    .file-item:hover { background: #f5f5f7; }

    .file-item input[type="checkbox"] {
      flex-shrink: 0;
      accent-color: #0071e3;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .file-item .dot {
      flex-shrink: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0071e3;
    }

    .file-item .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .file-item .ext-badge {
      flex-shrink: 0;
      font-size: 9px;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 3px;
      background: #f0f0f5;
      color: #6e6e73;
      text-transform: uppercase;
    }

    .file-item.unchecked .name      { color: #b0b0b5; }
    .file-item.unchecked .dot       { background: #d1d1d6; }
    .file-item.unchecked .ext-badge { opacity: 0.4; }

    #empty {
      padding: 24px 16px;
      text-align: center;
      color: #6e6e73;
      font-size: 12px;
    }

    footer {
      padding: 12px 16px;
    }

    #btn-action {
      width: 100%;
      padding: 8px;
      background: #0071e3;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    #btn-action:hover:not(:disabled) { background: #0077ed; }
    #btn-action:disabled { background: #b0b0b5; cursor: default; }

    #status {
      margin-top: 8px;
      font-size: 11px;
      color: #6e6e73;
      text-align: center;
    }

    #status.error   { color: #ff3b30; }
    #status.success { color: #34c759; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Cyberlearn Downloader</h1>
    <p id="subtitle">Recherche des fichiers…</p>
  </div>
  <button id="btn-reload" title="Recharger les fichiers">↻</button>
</header>

<div id="loader"><div id="loader-bar"></div></div>

<div id="mode-selector">
  <button class="mode-btn active" data-mode="compile">Compiler pour LLM</button>
  <button class="mode-btn"        data-mode="download">Télécharger fichiers</button>
</div>

<div id="options-toggle" style="display:none">
  <span>Options</span>
  <span class="chevron">▼</span>
</div>

<div id="options-panel">
  <label class="option-row">
    <input type="checkbox" id="chk-split">
    Un fichier <code>.md</code> par document
  </label>
  <div class="option-row section-label">Filtrer par type</div>
  <div id="type-filters"></div>
</div>

<div id="select-bar" style="display:none">
  <span id="checked-count"></span>
  <button id="btn-toggle-all">Tout décocher</button>
</div>

<div id="file-list"></div>
<div id="empty" style="display:none">Aucun fichier trouvé sur cette page.</div>

<footer>
  <button id="btn-action" disabled>Compiler</button>
  <div id="status"></div>
</footer>

<script type="module" src="popup.js"></script>
</body>
</html>
