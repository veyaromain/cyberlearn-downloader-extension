<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #ffffff;
      color: #1d1d1f;
    }

    header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid #e5e5e5;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    header p {
      margin-top: 3px;
      font-size: 11px;
      color: #6e6e73;
    }

    /* --- Sélecteur de mode --- */
    #mode-selector {
      display: flex;
      padding: 10px 16px;
      gap: 8px;
      border-bottom: 1px solid #e5e5e5;
    }

    .mode-btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 500;
      border: 1.5px solid #d1d1d6;
      border-radius: 7px;
      background: #fff;
      color: #6e6e73;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      line-height: 1.3;
    }

    .mode-btn:hover { border-color: #0071e3; color: #0071e3; }

    .mode-btn.active {
      border-color: #0071e3;
      background: #0071e3;
      color: #fff;
    }

    /* --- Option split --- */
    #split-option {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      border-bottom: 1px solid #e5e5e5;
      font-size: 11px;
      color: #1d1d1f;
      cursor: pointer;
      user-select: none;
    }

    #split-option input[type="checkbox"] {
      accent-color: #0071e3;
      width: 13px;
      height: 13px;
      cursor: pointer;
    }

    /* --- Barre tout sélectionner / tout décocher --- */
    #select-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px 4px;
    }

    #select-bar span {
      font-size: 11px;
      color: #6e6e73;
    }

    #select-bar button {
      font-size: 11px;
      color: #0071e3;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    #select-bar button:hover { text-decoration: underline; }

    /* --- Liste des fichiers --- */
    #file-list {
      max-height: 200px;
      overflow-y: auto;
      padding: 4px 0 8px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 16px;
      font-size: 12px;
      color: #1d1d1f;
      cursor: pointer;
      user-select: none;
    }

    .file-item:hover { background: #f5f5f7; }

    .file-item input[type="checkbox"] {
      flex-shrink: 0;
      accent-color: #0071e3;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .file-item .dot {
      flex-shrink: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0071e3;
    }

    .file-item .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .file-item .ext-badge {
      flex-shrink: 0;
      font-size: 9px;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 3px;
      background: #f0f0f5;
      color: #6e6e73;
      text-transform: uppercase;
    }

    .file-item.unchecked .name      { color: #b0b0b5; }
    .file-item.unchecked .dot       { background: #d1d1d6; }
    .file-item.unchecked .ext-badge { opacity: 0.4; }

    #empty {
      padding: 24px 16px;
      text-align: center;
      color: #6e6e73;
      font-size: 12px;
    }

    footer {
      padding: 12px 16px;
      border-top: 1px solid #e5e5e5;
    }

    #btn-action {
      width: 100%;
      padding: 8px;
      background: #0071e3;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    #btn-action:hover:not(:disabled) { background: #0077ed; }
    #btn-action:disabled { background: #b0b0b5; cursor: default; }

    #status {
      margin-top: 8px;
      font-size: 11px;
      color: #6e6e73;
      text-align: center;
    }

    #status.error   { color: #ff3b30; }
    #status.success { color: #34c759; }
  </style>
</head>
<body>

<header>
  <h1>Cyberlearn Downloader</h1>
  <p id="subtitle">Recherche des fichiers…</p>
</header>

<div id="mode-selector">
  <button class="mode-btn active" data-mode="compile">Compiler pour LLM</button>
  <button class="mode-btn"        data-mode="download">Télécharger fichiers</button>
</div>

<label id="split-option">
  <input type="checkbox" id="chk-split">
  Un fichier <code>.md</code> par document
</label>

<div id="select-bar" style="display:none">
  <span id="checked-count"></span>
  <button id="btn-toggle-all">Tout décocher</button>
</div>

<div id="file-list"></div>
<div id="empty" style="display:none">Aucun fichier trouvé sur cette page.</div>

<footer>
  <button id="btn-action" disabled>Compiler</button>
  <div id="status"></div>
</footer>

<script type="module" src="popup.js"></script>
</body>
</html>
